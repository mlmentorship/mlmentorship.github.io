name: Content correction
description: Report a technical error, stale claim, broken link, or missing qualification.
title: "[Correction] "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping keep mlmentorship accurate. Do not include confidential interview questions, employer-protected information, personal candidate data, credentials, or private repository content.
  - type: input
    id: page
    attributes:
      label: Page URL
      description: Link directly to the page that needs correction.
      placeholder: https://mlmentorship.com/concepts/example/
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is incorrect or unclear?
      description: Quote the specific statement or describe the broken behavior.
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Proposed correction
      description: Give a replacement, missing qualification, derivation, or reproducible example.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Supporting evidence
      description: Link a primary source when one is available. Explain any important scope or date limits.
  - type: checkboxes
    id: public
    attributes:
      label: Public information check
      options:
        - label: I have not included confidential, proprietary, personal, or secret information.
          required: true
